<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Governance Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Farben und Schriften wie aalam.ch */
  :root{
    --bg:#F3F4F5; --card:#FFFFFF; --text:#15171A; --muted:#4B5158; --faint:#8A9099; --line:#D9DCDF;
    --accent:#8A2A2E; --accent-soft:#F5ECEC; --accent-text:#FFFFFF;
    --good:#2F6B4F; --warn:#A8701C; --bad:#8A2A2E;
    --radar-fill:rgba(138,42,46,.14); --radar-stroke:#8A2A2E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Public Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
  a{color:var(--accent);text-decoration-thickness:1.5px;text-underline-offset:3px}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);padding:26px 24px}
  .card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:0 solid var(--accent);pointer-events:none}
  .card::before{top:-1px;left:-1px;border-top-width:2px;border-left-width:2px}
  .card::after{bottom:-1px;right:-1px;border-bottom-width:2px;border-right-width:2px}
  h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;letter-spacing:-.015em;color:var(--text)}
  h1{font-size:1.75rem;margin:0 0 10px;line-height:1.15}
  h2{font-size:1.3rem;margin:0 0 4px}
  h3{font-size:1.02rem;margin:0 0 10px}
  p{margin:0 0 12px}
  .muted{color:var(--muted)}
  .small{font-size:.875rem}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    display:inline-flex;align-items:center;gap:9px;margin-bottom:10px}
  .eyebrow::before{content:"";width:9px;height:9px;flex:0 0 auto;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
  ul.plain{padding-left:18px;margin:0 0 16px}
  .btn{appearance:none;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-text);
    font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:600;padding:12px 20px;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--text);border-color:var(--text)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.secondary{background:transparent;color:var(--accent)}
  .btn.secondary:hover{background:transparent;color:var(--text)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.between{justify-content:space-between}
  .progress{height:4px;background:var(--line);overflow:hidden;margin:6px 0 20px}
  .progress > div{height:100%;background:var(--accent);transition:width .25s}
  .q{margin:22px 0}
  .opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);
    padding:10px 12px;margin:8px 0;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--accent)}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .lvl{flex:0 0 26px;height:26px;border:1px solid var(--line);font-family:'JetBrains Mono',monospace;
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.8rem;color:var(--muted)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel .lvl{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .opt input:focus-visible + .lvl{outline:2px solid var(--accent);outline-offset:2px}
  .score-big{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:2.8rem;font-weight:700;line-height:1}
  .grid2{display:grid;grid-template-columns:1fr;gap:18px}
  @media (min-width:640px){.grid2{grid-template-columns:1fr 1fr;align-items:center}}
  .bars .bar{margin:8px 0}
  .bars .lbl{display:flex;justify-content:space-between;font-size:.875rem}
  .bars .track{height:6px;background:var(--line);overflow:hidden;margin-top:4px}
  .bars .fill{height:100%}
  .rec{border-left:2px solid var(--accent);padding:4px 0 4px 14px;margin:16px 0}
  .next{background:var(--accent-soft);padding:9px 12px;margin-top:8px}
  .tool{background:var(--bg);border:1px solid var(--line);padding:12px 14px;margin-top:8px;font-size:.85rem}
  .tool ul{margin:4px 0 6px;padding-left:18px}
  .tool a{font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:600}
  .disclaimer{font-size:.8rem;color:var(--faint);margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
  svg text{fill:var(--muted);font-size:12px;font-family:'Public Sans',system-ui,sans-serif}
  @media print{
    body{background:#fff}
    .noprint{display:none!important}
    .card{border:none;padding:0}
    .card::before,.card::after{display:none}
  }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app" aria-live="polite"></div></div>

<script>
const DIMS = [
  { name:"Strategie & Policy", short:"Strategie",
    questions:[
      { q:"Welche Grundlagen für Vendor Governance existieren schriftlich?", opts:[
        "Keine schriftlichen Regeln.",
        "Einzelne Vorgaben (z. B. in der Einkaufsrichtlinie), aber keine eigene Policy.",
        "Eine eigene Vendor-Governance-Policy, von der Geschäftsleitung freigegeben, mit festgelegter Gesamtverantwortung auf Leitungsebene.",
        "Zusätzlich eine RACI bzw. Rollenbeschreibung (inklusive Datenschutz und Compliance) und ein Nachweis der letzten Überprüfung der Policy.",
        "Zusätzlich ein regelmässiger Bericht einer vom Fachbereich unabhängigen Stelle (z. B. Risk oder Compliance) an Geschäftsleitung bzw. Verwaltungsrat, mit dokumentierten Entscheidungen."]},
      { q:"Wann werden Einkauf, Vendor Management bzw. Security eingebunden, wenn ein Fachbereich einen neuen IT-Dienstleister beauftragen möchte?", opts:[
        "Die Fachbereiche beauftragen in der Regel eigenständig.",
        "Das hängt vom Projekt oder von den beteiligten Personen ab – eine verbindliche Regel gibt es nicht.",
        "Es gibt eine verbindliche Regel: Ohne Freigabe durch diese Stellen wird kein Vertrag unterschrieben.",
        "Diese Stellen sind schon dabei, bevor Angebote eingeholt werden – ihre Anforderungen bestimmen mit, welche Anbieter infrage kommen.",
        "Bevor überhaupt ein neuer Anbieter gesucht wird, wird geprüft, ob bestehende Lieferanten oder Verträge den Bedarf abdecken."]}
    ],
    rec:{
      low:"Eine schlanke Vendor-Governance-Policy mit klaren Rollen (Vendor Owner, Einkauf, Legal, Datenschutz, Compliance, Security) und einer RACI aufsetzen und die Gesamtverantwortung auf Leitungsebene festlegen – das ist das Fundament für alle weiteren Schritte.",
      high:"Policy-Einhaltung über wenige Kennzahlen messbar machen, durch eine vom Fachbereich unabhängige Stelle überwachen lassen und jährlich gegen die Sourcing-Strategie spiegeln."},
    tool:{
      low:["Rollenprüfung je Vertrag (z. B. Contract Owner, Legal Counsel, Vendor Manager, Datenschutz)"],
      high:["KPI-Dashboards und zeitgesteuerte Reports (PDF, HTML, Excel) per E-Mail"]}
  },
  { name:"Inventar & Klassifizierung", short:"Inventar",
    questions:[
      { q:"Wie schnell könnten Sie alle Lieferanten auflisten, die Zugriff auf personenbezogene Daten haben?", opts:[
        "Gar nicht verlässlich.",
        "In Wochen – per Rundmail an die Fachbereiche.",
        "In einigen Tagen – aus einer zentralen Liste, mit Nacharbeit.",
        "Innerhalb von Stunden – per Abfrage im Lieferanteninventar.",
        "Sofort – inklusive Sub-Dienstleistern und Datenstandorten."]},
      { q:"Woran erkennt man bei Ihnen, ob ein Lieferant besonders wichtig oder riskant ist?", opts:[
        "Gar nicht – alle Lieferanten werden gleich behandelt.",
        "Die Beteiligten wissen es aus Erfahrung, festgehalten ist es aber nirgends.",
        "Es gibt feste Kriterien (z. B. Folgen eines Ausfalls, Zugriff auf Daten, Vertragsvolumen), und jeder Lieferant ist danach eingestuft.",
        "Die Einstufung hat Folgen: Wichtige Lieferanten werden z. B. gründlicher und häufiger überprüft als andere.",
        "Die Einstufung wird aktualisiert, sobald sich etwas ändert – etwa nach einem Vorfall oder wenn der Lieferant neue Leistungen übernimmt."]}
    ],
    rec:{
      low:"Ein zentrales Lieferanteninventar aufbauen und alle Lieferanten anhand weniger, klarer Kriterien in Kritikalitätsklassen einteilen.",
      high:"Sub-Dienstleister und Datenflüsse ins Inventar aufnehmen und die Neubewertung an Ereignisse (Vorfall, Scope-Änderung) koppeln."},
    tool:{
      low:["Zentrales Datenmodell Lieferant → Vertrag → Lizenz / Service",
           "LEI-Abgleich über GLEIF und Tier-Klassifizierung je Lieferant"],
      high:["Erfassung von Datenverarbeitung, Fernzugriff, Sub-Dienstleistern und Datenstandorten je Lieferant bzw. Service"]}
  },
  { name:"Vertragsmanagement", short:"Verträge",
    questions:[
      { q:"Wie schnell finden Sie für einen beliebigen Lieferanten den gültigen Vertrag samt Kündigungsfrist?", opts:[
        "Oft gar nicht – Verträge sind teilweise unauffindbar.",
        "In Tagen – Suche in Postfächern und Ordnern.",
        "In Minuten – zentrale Ablage, die Frist muss aber im Dokument nachgelesen werden.",
        "Sofort – Laufzeit und Frist sind als Daten erfasst, Erinnerungen laufen automatisch.",
        "Sofort – inklusive Übersicht über Konditionen und Abweichungen von Musterklauseln."]},
      { q:"Welche Vertragsvorgaben existieren?", opts:[
        "Keine – meist wird auf Lieferantenpapier unterschrieben.",
        "Einzelne Musterverträge, deren Nutzung freiwillig ist.",
        "Verbindliche Musterklauseln für Datenschutz, Audit-Rechte, SLAs, Haftung, Sub-Dienstleister, Meldefristen bei Vorfällen und Exit.",
        "Zusätzlich ein dokumentierter Freigabeprozess für Abweichungen.",
        "Zusätzlich ein Nachweis, dass die Klauseln regelmässig an neue Regulierung angepasst werden."]}
    ],
    rec:{
      low:"Zuerst alle Verträge zentral erfassen, mindestens mit Laufzeit, Kündigungsfrist und Verantwortlichen. Danach Musterklauseln definieren, beginnend mit Datenschutz, Haftung und Exit; später folgen Audit-Rechte, SLAs, Sub-Dienstleister, Meldefristen bei Vorfällen und Kündigungsrechte.",
      high:"Fristen-Erinnerungen automatisieren und Klauselabweichungen auswerten, um Verhandlungspositionen datenbasiert zu stärken."},
    tool:{
      low:["Automatische Fristenüberwachung und Kündigungsassistent",
           "Prüfung gegen eine 14-Punkte-Klausel-Baseline (z. B. AVV, Haftung, Audit-Rechte, Exit)"],
      high:["Automatische Fristenüberwachung und Kündigungsassistent",
            "Vollständigkeits-Score mit konkreten Lückenhinweisen je Vertrag"]}
  },
  { name:"Risiko & Compliance", short:"Risiko",
    questions:[
      { q:"Was existiert zur Bewertung von Lieferantenrisiken?", opts:[
        "Nichts – Risiken werden erst nach Vorfällen betrachtet.",
        "Einzelne Bewertungen, ohne einheitliche Vorlage.",
        "Ein standardisierter Fragebogen bzw. eine Bewertungsvorlage, die vor Vertragsabschluss genutzt wird, inklusive Grundprüfungen wie Sanktionslisten.",
        "Zusätzlich dokumentierte Re-Assessments mit nachverfolgten Massnahmen.",
        "Zusätzlich laufendes Monitoring (z. B. Ratings, Zertifikate, Meldungen) mit definierten Frühwarnindikatoren."]},
      { q:"Ist geklärt, welche Regelwerke für Ihre Lieferantenbeziehungen gelten (z. B. nDSG, DSGVO, ISG, bei Finanzinstituten FINMA-Vorgaben oder DORA, je nach Sektor NIS2)?", opts:[
        "Nein, das wurde nie geprüft.",
        "Ungefähr bekannt, aber nicht dokumentiert.",
        "Eine dokumentierte Einordnung liegt vor, inklusive der Frage, welche Leistungen als regulatorische Auslagerung gelten.",
        "Zusätzlich sind die daraus folgenden Anforderungen in Verträgen und Prozessen umgesetzt.",
        "Zusätzlich werden regulatorische Änderungen laufend verfolgt und die Einordnung bei Bedarf angepasst."]},
      { q:"Ein Prüfer verlangt Nachweise zu Ihren wesentlichen Lieferanten bzw. Auslagerungen. Wie schnell können Sie liefern?", opts:[
        "Gar nicht – Nachweise existieren kaum.",
        "In Wochen – die Nachweise müssen erst erstellt werden.",
        "In einigen Tagen – Unterlagen existieren, müssen aber zusammengetragen werden.",
        "Innerhalb eines Tages – z. B. aus einem gepflegten Lieferanten- bzw. Auslagerungsregister.",
        "Sofort – die Nachweise sind aktuell, regulatorische Änderungen bereits eingearbeitet."]}
    ],
    rec:{
      low:"Ein standardisiertes Risk Assessment inklusive Grundprüfungen (z. B. Sanktionslisten) vor jedem neuen Vertrag einführen und dokumentiert klären, welche Regelwerke konkret gelten (z. B. nDSG, DSGVO, ISG, bei Finanzinstituten FINMA-Vorgaben oder DORA).",
      high:"Re-Assessments nach Kritikalität takten und um kontinuierliches Monitoring mit Frühwarnindikatoren ergänzen."},
    tool:{
      low:["KI-gestützte Vertragsanalyse mit Risiko-Report, Massnahmenplan und Audit-Fragebögen",
           "Compliance-Kataloge für DSGVO, nDSG, IT-Sicherheit, ISO/IEC 42001 und EU AI Act mit Status je Kriterium"],
      high:["Frühwarnung über Schwachstellen-Daten (ENISA EUVD) und quellenbelegte Nachrichtenauswertung je Lieferant"]}
  },
  { name:"Datenschutz & Vorfälle", short:"Datenschutz",
    questions:[
      { q:"Wie ist geregelt, wenn Lieferanten personenbezogene Daten in Ihrem Auftrag bearbeiten, auch im Ausland?", opts:[
        "Gar nicht – Verträge zur Auftragsbearbeitung gibt es kaum.",
        "Teilweise – für einzelne Lieferanten liegen Verträge vor, ein Überblick fehlt.",
        "Für alle betroffenen Lieferanten liegen Verträge zur Auftragsbearbeitung vor (Art. 9 nDSG bzw. Art. 28 DSGVO).",
        "Zusätzlich ist dokumentiert, in welche Länder Daten fliessen und auf welcher Grundlage (z. B. Standardvertragsklauseln).",
        "Zusätzlich werden neue oder geänderte Sub-Dienstleister vor dem Einsatz geprüft und freigegeben."]},
      { q:"Ein Lieferant hat eine Datenpanne oder einen Cyberangriff. Was ist geregelt?", opts:[
        "Nichts – ob und wann wir informiert würden, ist offen.",
        "Der Lieferant würde uns vermutlich informieren, vertraglich geregelt ist es nicht.",
        "Vertraglich vereinbarte Meldefristen, die zu unseren eigenen Meldepflichten passen (z. B. nDSG, DSGVO, ISG).",
        "Zusätzlich ein interner Ablauf mit Zuständigkeiten, der Vorfälle bei Lieferanten ausdrücklich einschliesst.",
        "Zusätzlich wurde der Ablauf geübt, und Vorfälle werden ausgewertet und fliessen in die Lieferantenbewertung ein."]}
    ],
    rec:{
      low:"Verträge zur Auftragsbearbeitung für alle Lieferanten mit Zugriff auf Personendaten nachziehen und Meldefristen für Vorfälle vertraglich vereinbaren, abgestimmt auf die eigenen Meldepflichten.",
      high:"Datenübermittlungen ins Ausland laufend dokumentieren, Sub-Dienstleister vor dem Einsatz freigeben und den Ablauf bei Vorfällen von Lieferanten regelmässig üben."},
    tool:{
      low:["Prüfung, ob ein Auftragsverarbeitungsvertrag (AVV) und eine Sub-Dienstleister-Klausel vorliegen (Teil der Klausel-Baseline)"],
      high:["Verarbeitungsverzeichnis nach Art. 30 DSGVO"]}
  },
  { name:"Performance-Steuerung", short:"Performance",
    questions:[
      { q:"Wie schnell können Sie sagen, wie gut Ihr wichtigster Lieferant im letzten Quartal geliefert hat?", opts:[
        "Nur nach Bauchgefühl.",
        "Nach Rückfrage bei den Fachbereichen – das Ergebnis bleibt subjektiv.",
        "In einigen Tagen – SLA-Berichte existieren, müssen aber ausgewertet werden.",
        "Sofort – aus einer Scorecard, die im regelmässigen Review besprochen wird.",
        "Sofort – inklusive Trend und Auswirkung auf Verlängerung oder Ausbau."]},
      { q:"Was existiert für die Steuerung strategischer Lieferanten?", opts:[
        "Nichts – Kontakt nur bei Problemen.",
        "Persönliche Kontakte Einzelner, nichts dokumentiert.",
        "Feste Ansprechpartner und regelmässige Termine mit Protokoll.",
        "Zusätzlich gemeinsam vereinbarte Ziele und nachverfolgte Massnahmenlisten.",
        "Zusätzlich eine gemeinsame Roadmap, die regelmässig mit dem Management abgestimmt wird."]}
    ],
    rec:{
      low:"Für die wichtigsten Lieferanten 3–5 Kennzahlen festlegen (z. B. Verfügbarkeit, Reaktionszeit, Termintreue) und diese quartalsweise in einem festen Termin mit dem Lieferanten besprechen.",
      high:"Die Leistungsbewertung für Entscheidungen nutzen: Vor jeder Vertragsverlängerung prüfen, wie der Lieferant abgeschnitten hat, und danach entscheiden – verlängern, nachverhandeln, ausbauen oder wechseln. Mit den wichtigsten Lieferanten zusätzlich gemeinsame Ziele für die nächsten 1–2 Jahre festhalten."}
  },
  { name:"Exit & Abhängigkeiten", short:"Exit",
    questions:[
      { q:"Ihr kritischster Lieferant fällt morgen aus oder kündigt. Was passiert?", opts:[
        "Wir merken es erst beim Ausfall und improvisieren.",
        "Man weiss ungefähr, was zu tun wäre – aufgeschrieben ist nichts.",
        "Ein dokumentierter Exit-Plan liegt vor.",
        "Der Exit-Plan ist aktuell, und Exit-Unterstützung ist vertraglich abgesichert (Rückgabe und Löschung der Daten, Übergangsfrist, Mitwirkung bei der Migration).",
        "Der Exit-Plan wurde getestet, und eine bewertete Alternative steht bereit."]},
      { q:"Was existiert zu Konzentrationsrisiken und Abhängigkeiten?", opts:[
        "Nichts.",
        "Abhängigkeiten sind bekannt, aber nirgends festgehalten.",
        "Eine Übersicht, welche Leistungen von einzelnen Lieferanten abhängen.",
        "Zusätzlich eine regelmässige Bewertung und Berichterstattung, inklusive Cloud- und Sub-Dienstleistern.",
        "Zusätzlich definierte Grenzen im Risikoappetit und Massnahmen wie Multi-Sourcing oder Portabilität."]}
    ],
    rec:{
      low:"Für die kritischsten Lieferanten Exit-Strategien dokumentieren und Exit-Unterstützung vertraglich absichern: Rückgabe und Löschung der Daten, Übergangsfrist und Mitwirkung bei der Migration.",
      high:"Exit-Pläne praktisch testen und Konzentrationsrisiken – auch bei Cloud- und Sub-Dienstleistern – regelmässig berichten."},
    tool:{
      low:["Prüfung, ob Exit-Regelungen vertraglich abgedeckt sind (Teil der Klausel-Baseline)"],
      high:["Beziehungsgraph der IT-Assets zur Sichtbarmachung von Abhängigkeiten",
            "KI-gestützter Entwurf einer Ausschreibung (RfX) aus bestehenden Lizenz- und Nutzungsdaten"]}
  }
];

const LEVELS = [
  { max:1.8, name:"Initial", text:"Lieferanten werden weitgehend ad hoc gesteuert. Erfolg hängt an einzelnen Personen; Risiken bleiben oft unentdeckt." },
  { max:2.6, name:"Wiederholbar", text:"Erste Strukturen sind vorhanden, aber uneinheitlich. Ein verbindlicher Rahmen würde den grössten Hebel bringen." },
  { max:3.4, name:"Definiert", text:"Prozesse und Rollen sind dokumentiert und unternehmensweit gültig. Nächster Schritt: Wirksamkeit messen und steuern." },
  { max:4.2, name:"Gesteuert", text:"Vendor Governance wird über Kennzahlen gesteuert und regelmässig überprüft. Optimierungspotenzial liegt in Automatisierung und Vorausschau." },
  { max:9,   name:"Optimierend", text:"Vendor Governance ist strategisch verankert, datengetrieben und wird kontinuierlich verbessert." }
];

const app = document.getElementById("app");
const answers = {};
let step = -1; // -1 = Intro, 0..5 = Dimensionen, 6 = Ergebnis

const key = (d,q) => d + "-" + q;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const answered = k => answers[k] !== undefined;
const dimScore = d => DIMS[d].questions.reduce((s,_,q)=>s+Math.max(1,answers[key(d,q)]),0) / DIMS[d].questions.length;
const levelFor = v => LEVELS.find(l => v < l.max);
const colorFor = v => v < 2.6 ? "var(--bad)" : v < 3.4 ? "var(--warn)" : "var(--good)";

function render(){
  if(step === -1) return renderIntro();
  if(step >= DIMS.length) return renderResult();
  renderStep();
}

function renderIntro(){
  app.innerHTML = `
    <div class="eyebrow">Selbsteinschätzung</div>
    <h1>Vendor Governance Reifegrad-Check</h1>
    <p class="muted">Wie professionell steuert Ihre Organisation ihre IT-Lieferanten? In rund 5 Minuten erhalten Sie eine Einordnung über sieben Dimensionen – mit konkreten Handlungsempfehlungen.</p>
    <ul class="plain small muted">
      <li>15 Fragen, je 5 Reifegradstufen (angelehnt an die CMMI-Logik)</li>
      <li>Im Zweifel «Weiss ich nicht» wählen – das wird wie Stufe 1 gewertet</li>
      <li>Ergebnis als Radar-Diagramm mit Top-3-Handlungsfeldern</li>
      <li>Läuft vollständig im Browser – es werden keine Daten gespeichert oder übertragen</li>
    </ul>
    <button class="btn" id="start">Check starten</button>`;
  document.getElementById("start").onclick = () => { step = 0; render(); };
}

function renderStep(){
  const d = DIMS[step];
  const pct = Math.round(step / DIMS.length * 100);
  let html = `
    <div class="small muted">Dimension ${step+1} von ${DIMS.length}</div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <h2>${esc(d.name)}</h2>`;
  d.questions.forEach((qq,qi) => {
    const k = key(step,qi);
    html += `<fieldset class="q" style="border:0;padding:0;margin-left:0;margin-right:0">
      <legend><h3>${esc(qq.q)}</h3></legend>`;
    qq.opts.forEach((o,oi) => {
      const v = oi+1, sel = answers[k] === v;
      html += `<label class="opt${sel?" sel":""}">
        <input type="radio" name="${k}" value="${v}" ${sel?"checked":""}>
        <span class="lvl" aria-hidden="true">${v}</span>
        <span>${esc(o)}</span></label>`;
    });
    const unk = answers[k] === 0;
    html += `<label class="opt${unk?" sel":""}">
      <input type="radio" name="${k}" value="0" ${unk?"checked":""}>
      <span class="lvl" aria-hidden="true">?</span>
      <span class="muted">Weiss ich nicht</span></label>`;
    html += `</fieldset>`;
  });
  const done = d.questions.every((_,qi) => answered(key(step,qi)));
  html += `<div class="row between">
    <button class="btn secondary" id="back">Zurück</button>
    <button class="btn" id="next" ${done?"":"disabled"}>${step === DIMS.length-1 ? "Auswertung anzeigen" : "Weiter"}</button>
  </div>`;
  app.innerHTML = html;

  app.querySelectorAll("input[type=radio]").forEach(inp => {
    inp.onchange = () => {
      answers[inp.name] = +inp.value;
      app.querySelectorAll(`input[name="${inp.name}"]`).forEach(i =>
        i.closest(".opt").classList.toggle("sel", i.checked));
      document.getElementById("next").disabled =
        !d.questions.every((_,qi) => answered(key(step,qi)));
    };
  });
  document.getElementById("back").onclick = () => { step--; render(); window.scrollTo(0,0); };
  document.getElementById("next").onclick = () => { step++; render(); window.scrollTo(0,0); };
}

function radarSVG(scores){
  const cx=200, cy=165, R=105, n=scores.length;
  const pt = (i,r) => {
    const a = -Math.PI/2 + i*2*Math.PI/n;
    return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  };
  let s = `<svg viewBox="-40 0 480 330" width="100%" role="img" aria-label="Radar-Diagramm der Reifegrade je Dimension">`;
  for(let l=1;l<=5;l++){
    const poly = scores.map((_,i)=>pt(i,R*l/5).join(",")).join(" ");
    s += `<polygon points="${poly}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  scores.forEach((_,i)=>{
    const [x,y]=pt(i,R);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
  });
  const data = scores.map((v,i)=>pt(i,R*v/5).join(",")).join(" ");
  s += `<polygon points="${data}" fill="var(--radar-fill)" stroke="var(--radar-stroke)" stroke-width="2"/>`;
  scores.forEach((v,i)=>{
    const [x,y]=pt(i,R*v/5);
    s += `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--radar-stroke)"/>`;
  });
  DIMS.forEach((d,i)=>{
    const [x,y]=pt(i,R+20);
    const anchor = Math.abs(x-cx) < 5 ? "middle" : (x > cx ? "start" : "end");
    const dy = y < cy-50 ? -2 : (y > cy+50 ? 12 : 4);
    s += `<text x="${x}" y="${y+dy}" text-anchor="${anchor}">${esc(d.short)} ${scores[i].toFixed(1)}</text>`;
  });
  return s + `</svg>`;
}

function renderResult(){
  const scores = DIMS.map((_,i)=>dimScore(i));
  const total = scores.reduce((a,b)=>a+b,0)/scores.length;
  const lvl = levelFor(total);
  const weakest = scores.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v).slice(0,3);
  const unknown = Object.values(answers).filter(v => v === 0).length;

  let bars = scores.map((v,i)=>`
    <div class="bar"><div class="lbl"><span>${esc(DIMS[i].name)}</span><span>${v.toFixed(1)} / 5</span></div>
    <div class="track"><div class="fill" style="width:${v/5*100}%;background:${colorFor(v)}"></div></div></div>`).join("");

  // Schwächste Frage der Dimension; die Antwort der nächsthöheren Stufe ist der nächste Schritt
  const nextStep = d => {
    const w = DIMS[d].questions.map((qq,qi)=>({qq, a:answers[key(d,qi)]}))
      .sort((x,y)=>Math.max(1,x.a)-Math.max(1,y.a))[0];
    if(w.a === 0) return {q:w.qq.q, text:"Zuerst den Ist-Stand klären: Wer in Ihrer Organisation kann diese Frage beantworten, und was lässt sich belegen?"};
    if(w.a >= 5) return null;
    return {q:w.qq.q, lvl:w.a+1, text:w.qq.opts[w.a]};
  };

  let recs = weakest.map(w=>{
    const ns = nextStep(w.i);
    return `
    <div class="rec"><strong>${esc(DIMS[w.i].name)}</strong> <span class="small muted">(${w.v.toFixed(1)} / 5)</span>
    <p class="small" style="margin:4px 0 0">${esc(w.v < 3 ? DIMS[w.i].rec.low : DIMS[w.i].rec.high)}</p>
    ${ns ? `<div class="next small"><span class="muted">Ihr schwächster Punkt: ${esc(ns.q)}</span><br>
      <strong>${ns.lvl ? `Nächste Stufe (${ns.lvl}):` : "Nächster Schritt:"}</strong> ${esc(ns.text)}</div>` : ""}
    </div>`;}).join("");

  const tools = weakest
    .map(w=>({name:DIMS[w.i].name, items:DIMS[w.i].tool ? DIMS[w.i].tool[w.v < 3 ? "low" : "high"] : []}))
    .filter(t=>t.items.length);
  const toolBox = tools.length ? `<div class="tool noprint" style="margin-top:20px"><strong>Software-Unterstützung – umgesetzt in einem meiner Referenzprojekte:</strong>
      ${tools.map(t=>`<div style="margin-top:8px">${esc(t.name)}</div><ul>${t.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`).join("")}
      <a href="https://aalam.ch/referenzprojekte/vendor-data-management/" target="_blank" rel="noopener">Referenzprojekt ansehen →</a></div>` : "";

  app.innerHTML = `
    <div class="eyebrow">Ihr Ergebnis</div>
    <div class="grid2">
      <div>
        <div class="score-big">${total.toFixed(1)} <span class="small muted" style="font-size:1rem;font-weight:400">/ 5</span></div>
        <h2 style="margin-top:6px">Reifegrad: ${lvl.name}</h2>
        <p class="muted">${lvl.text}</p>
      </div>
      <div>${radarSVG(scores)}</div>
    </div>
    <div class="bars" style="margin-top:8px">${bars}</div>
    ${unknown ? `<p class="small muted" style="margin-top:12px">${unknown} ${unknown === 1 ? "Antwort" : "Antworten"} mit «Weiss ich nicht» wurden wie Stufe 1 gewertet. Was sich nicht nachweisen lässt, zählt in einer Prüfung in der Regel als nicht vorhanden.</p>` : ""}
    <h3 style="margin-top:26px">Ihre drei grössten Hebel</h3>
    ${recs}
    ${toolBox}
    <div class="row noprint" style="margin-top:22px">
      <button class="btn" id="print">Als PDF speichern</button>
      <button class="btn secondary" id="restart">Neu starten</button>
    </div>
    <p class="noprint small" style="margin-top:18px">Möchten Sie das Ergebnis einordnen oder nächste Schritte besprechen? <a href="https://aalam.ch/kontakt/" target="_blank" rel="noopener" style="color:var(--accent)">Erstgespräch vereinbaren</a></p>
    <div class="disclaimer">Dieser Check ist eine vereinfachte Selbsteinschätzung und ersetzt kein Audit oder keine rechtliche Prüfung. Die Stufen sind an die Logik gängiger Reifegradmodelle (CMMI) angelehnt. Alle Eingaben werden ausschliesslich in Ihrem Browser verarbeitet.</div>`;

  document.getElementById("print").onclick = () => window.print();
  document.getElementById("restart").onclick = () => {
    for(const k in answers) delete answers[k];
    step = -1; render(); window.scrollTo(0,0);
  };
}

render();
</script>
</body>
</html>
